name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fired by content repos (e.g. puzzle-solves) when their main branch changes.
  repository_dispatch:
    types: [content-updated]
  # Manual "redeploy now" button in the Actions tab.
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

  deploy:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Never run two SST deploys at once; queue instead of cancelling mid-deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log content trigger
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          SHA: ${{ github.event.client_payload.sha }}
        run: echo "Triggered by $SOURCE @ $SHA"

      # Content is pulled by the `prebuild` script (scripts/sync-content.ts),
      # which sst deploy runs via `npm run build`.
      - name: Deploy to production
        run: bunx sst deploy --stage production
